<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:628px;background:#212121;font-family:"Segoe UI",system-ui,sans-serif;color:#ececec;overflow:hidden}
.top{height:56px;display:flex;align-items:center;padding:0 28px;font-size:19px;font-weight:600;color:#e3e3e3}
.top span{color:#9b9b9b;font-weight:400;margin-left:6px}
.wrap{width:820px;margin:18px auto 0}
.user{display:flex;justify-content:flex-end}
.user div{background:#303030;border-radius:24px;padding:14px 22px;font-size:22px;max-width:640px}
.bot{display:flex;gap:16px;margin-top:30px}
.av{width:34px;height:34px;border-radius:50%;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.ans{font-size:22px;line-height:1.55}
ol{margin-top:10px;padding-left:28px}
li{margin:4px 0;font-weight:600}
a{color:#7ab7ff;text-decoration:underline;font-weight:400;margin-left:8px;font-size:19px}
.inp{position:absolute;bottom:26px;left:190px;width:820px;height:56px;border-radius:28px;background:#303030;color:#8f8f8f;font-size:19px;display:flex;align-items:center;padding:0 24px}
</style></head><body>
<div class="top">ChatGPT<span>5</span></div>
<div class="wrap">
 <div class="user"><div id="q"></div></div>
 <div class="bot"><div class="av">✺</div><div class="ans"><div id="intro"></div><ol id="list"></ol></div></div>
</div>
<div class="inp">Poser une question</div>
</body></html>
